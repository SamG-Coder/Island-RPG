<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Island RPG — Shore Trial</title>
  <meta name="description" content="Play a browser shore trial of Island RPG. Walk, gather, craft, cook and fight a slime. Right-click the bag and the world the same way as the Windows game.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://samg-coder.github.io/Island-RPG/play.html">
  <link rel="icon" href="assets/icon.jpg" type="image/jpeg">
  <meta property="og:title" content="Island RPG — Shore Trial">
  <meta property="og:description" content="A small seeded island in the browser: gather, craft, light a fire and survive.">
  <meta property="og:image" content="https://samg-coder.github.io/Island-RPG/assets/og-cover.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@SamGCoder">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="play.css">
</head>
<body class="play-page">
  <header class="play-bar">
    <a class="brand" href="index.html">← Island RPG</a>
    <div class="play-title">
      <strong>Shore trial</strong>
      <span>A taste of the single-player loop</span>
    </div>
    <label class="seed">Seed <input data-mini-seed type="number" value="2187"></label>
    <button type="button" class="go" data-mini-start>Begin</button>
    <a class="dl" href="https://github.com/SamG-Coder/Island-RPG/releases">Full game</a>
  </header>

  <div class="stage" data-mini-frame>
    <canvas data-mini-canvas width="1280" height="720" aria-label="Island RPG shore trial"></canvas>
    <p class="cursor-hint" data-mini-cursor>Begin, then left-click to act. Right-click the world or your bag.</p>
    <div class="vitals">
      <div><span>Health</span><i><b data-mini-hp></b></i></div>
      <div><span>Hunger</span><i class="hunger"><b data-mini-hunger></b></i></div>
      <div class="clock" data-mini-clock>07:00</div>
    </div>
    <aside class="skills" data-mini-skills></aside>
    <div class="log" data-mini-log><p>Begin to wash up on the south beach.</p></div>
  </div>

  <section class="bag" aria-label="Inventory">
    <header>
      <h1>Bag</h1>
      <p>Left-click to select. Right-click for Eat, Drop, Place, Examine. Drag to swap.</p>
    </header>
    <div class="slots" data-mini-inv></div>
    <div class="recipes" data-mini-craft></div>
  </section>

  <div class="menu" hidden data-ctx></div>
  <div class="examine" hidden data-examine></div>

  <script src="minigame.js"></script>
</body>
</html>
